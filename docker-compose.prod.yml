# Production stack for the VPS. Pulls pre-built images rather than building:
# the server does no compilation, and the exact artefact CI tested is the one
# that runs.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chinook"]
      interval: 5s
      retries: 10
    # No ports section: the database is reachable only from the compose network.
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USERNAME}/text-to-sql-api:${TAG:-latest}
    environment:
      DB_HOST: db
      APP_RO_PASSWORD: ${APP_RO_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RATE_LIMIT: ${RATE_LIMIT:-10/minute}
    # Bound to loopback: nginx on the host terminates TLS and proxies in, so
    # the container itself is never exposed to the internet.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/text-to-sql-frontend:${TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
