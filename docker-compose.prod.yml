# Production stack for the VPS. Pulls pre-built images rather than building:
# the server does no compilation, and the exact artefact CI tested is the one
# that runs.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# This box already runs a separate "blog" stack whose nginx container owns
# 80/443 and routes to backends BY CONTAINER NAME over the blog_default
# network. So these services join that network instead of publishing ports:
# binding to host loopback would be unreachable from a proxy that is itself a
# container.
#
# Services are prefixed sql-* because Compose registers every service name as a
# network alias, and the blog stack already has one called "frontend".

services:
  sql-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chinook"]
      interval: 5s
      retries: 10
    # Default network only: no published port, and deliberately not on the
    # shared network, so nothing outside this stack can reach the database.
    restart: unless-stopped

  sql-api:
    image: ${DOCKERHUB_USERNAME}/text-to-sql-api:${TAG:-latest}
    environment:
      DB_HOST: sql-db
      APP_RO_PASSWORD: ${APP_RO_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RATE_LIMIT: ${RATE_LIMIT:-10/minute}
    networks:
      - default
      - blog_default
    depends_on:
      sql-db:
        condition: service_healthy
    # Reached as http://sql-api:8000 from the nginx container.
    restart: unless-stopped

  sql-frontend:
    image: ${DOCKERHUB_USERNAME}/text-to-sql-frontend:${TAG:-latest}
    networks:
      - default
      - blog_default
    depends_on:
      - sql-api
    restart: unless-stopped

networks:
  # Created and owned by the blog stack; declared external so this file never
  # tries to manage or remove it.
  blog_default:
    external: true

volumes:
  pgdata:
