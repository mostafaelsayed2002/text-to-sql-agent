name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets CD reuse this workflow so tests genuinely gate the build, rather than
  # duplicating the steps and letting the two drift apart.
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # The validator suite needs no database and no API key, which is why it is
      # the part of this system worth testing.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `next build` typechecks more strictly than the dev server does, so this
      # catches type errors as well as build failures.
      - run: npm run build
        working-directory: frontend
