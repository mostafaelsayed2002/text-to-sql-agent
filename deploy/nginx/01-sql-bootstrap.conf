# Step 1 of two. HTTP only, no certificate referenced.
#
# nginx refuses to start if a config names a certificate that does not exist,
# and this nginx container also serves the blog. So the ACME challenge is
# served first, the certificate obtained, and only then is the TLS block added.
#
# Copy to /opt/blog/nginx/conf.d/ and reload, then run certbot (see deploy/README.md).

server {
    listen 80;
    server_name sql.elsayed2002.tech;

    # Same webroot the blog's certbot container already renews through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
