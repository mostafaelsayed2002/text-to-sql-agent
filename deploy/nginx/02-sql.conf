# Step 2 of two. Replaces 01-sql-bootstrap.conf once the certificate exists.

server {
    listen 80;
    server_name sql.elsayed2002.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sql.elsayed2002.tech;

    ssl_certificate     /etc/letsencrypt/live/sql.elsayed2002.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sql.elsayed2002.tech/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Docker's embedded DNS. Resolving upstreams at request time rather than at
    # startup matters here: with literal names, `nginx -t` FAILS whenever the
    # sql-* containers are not running, which would stop this nginx -- the one
    # serving the blog -- from reloading or restarting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- API -> FastAPI ----------------------------------------------------
    # The blog's backend mounts its routes at /api; FastAPI serves /query and
    # /schema at the root, so the prefix is stripped before forwarding.
    location /api/ {
        set $sql_api http://sql-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass       $sql_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A question takes a few seconds; the model can be slower still.
        proxy_read_timeout 90s;
    }

    # ---- everything else -> Next.js ----------------------------------------
    location / {
        set $sql_frontend http://sql-frontend:3000;
        proxy_pass       $sql_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
